[build]
  base = "/"
  publish = "public/"
  command = "gatsby build"

[build.environment]
  # 以下の理由により、 Node.js のバージョンはここでは指定しない。
  # - Netlify は Node.js のバージョンの決定に nvm か mise のどちらかが使われる。
  #   - nvm の場合は .node-version を見るので解決される。
  #   - mise の場合は mise.toml に idiomatic_version_file_enable_tools の指定があるので、結局 .node-version を参照する。  NODE_VERSION = "24.22.1"
  # node-gyp が v3.6.0 以上の Python を要求している
  PYTHON_VERSION = "3.15.0"
